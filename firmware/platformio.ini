; PlantGuard · firmware ESP32 (PlatformIO)
; Abre ESTA carpeta (firmware/) en VS Code con la extensión PlatformIO.
; Compilar: ✓ en la barra azul de abajo · Subir: → · Monitor Serie: 🔌

[env:esp32dev]
platform = espressif32
board = esp32dev            ; ESP32 DevKit / "ESP32 Dev Module". Si tu placa es ESP32-S3, usa: esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.2.0
